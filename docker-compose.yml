services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fraudlink
      POSTGRES_USER: fraudlink
      POSTGRES_PASSWORD: fraudlink
    ports:
      - "5432:5432"
    volumes:
      - fraudlink_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraudlink"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  fraudlink_postgres:

